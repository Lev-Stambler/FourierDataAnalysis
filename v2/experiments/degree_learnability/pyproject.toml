[project]
name = "dlx"
version = "0.1.0"
description = "Degree-learnability experiments: categorical degree profiles as a proxy for Transformer learnability (v2/PLAN.md)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
gpu = ["torch>=2.3", "torchvision>=0.18"]
modal = ["modal>=0.64"]
analysis = ["scipy>=1.11", "pandas>=2.1", "matplotlib>=3.8", "scikit-learn>=1.4", "openml>=0.14"]
data = ["datasets>=2.19", "tokenizers>=0.19", "transformers>=4.44"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dlx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
