[project]
name = "qwen-adamw-control"
version = "0.1.0"
description = "Winner-matched AdamW control for the NorMuon pretraining study"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "torch==2.10.0",
    "wandb>=0.18",
    "qwen-normuon-pretrain",
]

[tool.uv.sources]
qwen-normuon-pretrain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qwen_adamw_control"]
