[project]
name = "qwen-normuon-pretrain"
version = "0.1.0"
description = "Next-token Kronecker pretraining with independently normalized NorMuon factors"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "torch==2.10.0",
    "transformers==5.13.1",
    "datasets>=5.0",
    "wandb>=0.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qwen_normuon_pretrain"]
