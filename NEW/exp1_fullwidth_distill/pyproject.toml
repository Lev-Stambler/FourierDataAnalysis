[project]
name = "qwen-fullwidth-distill"
version = "0.1.0"
description = "Full-width dense, Monarch, BTT, and Kronecker distillation from Qwen3.5-0.8B-Base"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "torch==2.10.0",
    "transformers==5.13.1",
    "datasets>=5.0",
    "hydra-core~=1.3",
    "wandb>=0.18",
    "modal>=1.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qwen_fullwidth_distill"]
